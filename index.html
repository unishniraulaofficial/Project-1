<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayline — Personal Planner</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --paper: #F6F0E2;
      --paper-edge: #ECE3D0;
      --ink: #2B3A55;
      --ink-soft: #55617A;
      --margin-red: #B5493C;
      --highlight: #E7B84B;
      --highlight-soft: #F3DFA6;
      --done-green: #5C7A5C;
      --paper-line: rgba(43, 58, 85, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #DED2B4;
      background-image:
        radial-gradient(ellipse at top left, rgba(255, 255, 255, 0.15), transparent 60%),
        radial-gradient(ellipse at bottom right, rgba(0, 0, 0, 0.06), transparent 60%);
      font-family: 'Work Sans', sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    .checkbox:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .hidden {
      display: none !important;
    }

    /* Auth Cover Styling */
    .cover {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #2B3A55, #22304A);
      border-radius: 10px;
      padding: 46px 34px 34px;
      position: relative;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5), 0 2px 0 rgba(255, 255, 255, 0.05) inset;
      animation: settle 0.6s cubic-bezier(.2, .9, .25, 1) both;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(18px) rotate(-1deg); }
      to { opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    .rings {
      position: absolute;
      top: -16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-evenly;
      padding: 0 30px;
    }

    .ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #DED2B4;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25) inset, 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .cover-title {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      color: #F6F0E2;
      font-size: 2.1rem;
      margin: 6px 0 2px;
    }

    .cover-sub {
      color: #B9C2D6;
      font-size: 0.9rem;
      margin: 0 0 30px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      color: #8FA0C2;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .field-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1.5px solid rgba(246, 240, 226, 0.3);
      transition: border-color 0.2s ease;
    }

    .field-input-row:focus-within {
      border-bottom-color: var(--highlight);
    }

    .field-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: #8FA0C2;
    }

   .field-input-row:focus-within .field-icon {
      color: var(--highlight);
    }

    .field input {
      width: 100%;
      background: transparent;
      border: none;
      color: #F6F0E2;
      font-size: 1rem;
      padding: 8px 2px;
    }

    .field input::placeholder {
      color: #5C6C8C;
    }

    .field input:focus {
      outline: none;
    }

    .cover-actions {
      display: flex;
      gap: 10px;
      margin-top: 26px;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 11px 18px;
      font-size: 0.92rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--highlight);
      color: #2B3A55;
      flex: 1;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 16px -4px rgba(231, 184, 75, 0.5);
    }

    .cover-error {
      color: #E38F84;
      font-size: 0.82rem;
      margin-top: 14px;
      min-height: 1.2em;
    }

    .switch-link {
      margin-top: 16px;
      text-align: center;
      font-size: 0.82rem;
      color: #8FA0C2;
    }

    .switch-link button {
      background: none;
      border: none;
      color: var(--highlight);
      font-weight: 600;
      text-decoration: underline;
      padding: 0;
    }

    .cover-note {
      margin-top: 22px;
      font-size: 0.72rem;
      color: #5C6C8C;
      line-height: 1.5;
      border-top: 1px dashed rgba(246, 240, 226, 0.15);
      padding-top: 14px;
    }

    /* Notebook App Styling */
    .book {
      width: 100%;
      max-width: 620px;
      background: var(--paper);
      border-radius: 4px 10px 10px 4px;
      position: relative;
      box-shadow: 0 24px 50px -18px rgba(43, 58, 85, 0.35), -6px 0 0 var(--paper-edge);
      padding: 40px 34px 34px 60px;
      animation: pageIn 0.5s cubic-bezier(.2, .9, .25, 1) both;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 38px,
        var(--paper-line) 39px,
        var(--paper-line) 40px
      );
      background-position: 0 128px;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .book::before {
      content: '';
      position: absolute;
      left: 34px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--margin-red);
      opacity: 0.55;
    }

    .book::after {
      content: '';
      position: absolute;
      left: 12px;
      top: 26px;
      bottom: 26px;
      width: 6px;
      background-image: radial-gradient(circle, rgba(43, 58, 85, 0.16) 3px, transparent 3.5px);
      background-size: 6px 30px;
      background-repeat: repeat-y;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .greeting {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      font-size: 1.9rem;
      color: var(--ink);
      line-height: 1.1;
    }

    .date-stamp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--ink-soft);
      letter-spacing: 0.03em;
      margin-top: 4px;
    }

    .logout {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 0.78rem;
      text-decoration: underline;
      padding: 4px;
    }

    .logout:hover {
      color: var(--margin-red);
    }

    .add-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }

    .add-row input {
      flex: 1;
      border: none;
      background: transparent;
      border-bottom: 1.5px solid rgba(43, 58, 85, 0.25);
      font-family: 'Kalam', cursive;
      font-size: 1.15rem;
      color: var(--ink);
      padding: 6px 2px;
    }

    .add-row input::placeholder {
      color: rgba(43, 58, 85, 0.35);
      font-family: 'Work Sans', sans-serif;
      font-size: 0.95rem;
    }

    .add-row input:focus {
      outline: none;
      border-bottom-color: var(--ink);
    }

    .add-btn {
      background: var(--ink);
      color: var(--paper);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .add-btn:hover {
      background: var(--margin-red);
      transform: rotate(90deg);
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filter-tab {
      background: var(--highlight-soft);
      border: none;
      padding: 5px 12px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--ink);
      border-radius: 3px 3px 0 0;
      opacity: 0.55;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .filter-tab.active {
      opacity: 1;
      transform: translateY(0);
      box-shadow: 0 -2px 6px rgba(43, 58, 85, 0.08);
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
      min-height: 120px;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 9px 4px;
      animation: taskIn 0.3s ease both;
    }

    @keyframes taskIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task.removing {
      animation: taskOut 0.25s ease forwards;
    }

    @keyframes taskOut {
      to { opacity: 0; transform: translateX(20px); }
    }

    .checkbox {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 2px;
      background: none;
      border: none;
      padding: 0;
    }

    .checkbox svg {
      width: 100%;
      height: 100%;
    }

    .checkbox .box {
      fill: none;
      stroke: var(--ink-soft);
      stroke-width: 1.6;
    }

    .checkbox .tick {
      fill: none;
      stroke: var(--done-green);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      transition: stroke-dashoffset 0.3s ease 0.05s;
    }

    .task.done .checkbox .tick {
      stroke-dashoffset: 0;
    }

    .task-text {
      flex: 1;
      font-family: 'Kalam', cursive;
      font-size: 1.08rem;
      color: var(--ink);
      line-height: 1.4;
      position: relative;
      word-break: break-word;
    }

    .task-text .strike {
      position: absolute;
      left: 0;
      top: 52%;
      width: 0;
      height: 2px;
      background: var(--margin-red);
      transform: rotate(-1deg);
      transition: width 0.35s ease;
    }

    .task.done .task-text {
      color: rgba(43, 58, 85, 0.4);
    }

    .task.done .task-text .strike {
      width: 100%;
    }

    .task-actions {
      display: flex;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .task:hover .task-actions,
    .task:focus-within .task-actions {
      opacity: 1;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 0.95rem;
      width: 26px;
      height: 26px;
      border-radius: 4px;
    }

    .icon-btn:hover {
      background: rgba(43, 58, 85, 0.08);
      color: var(--margin-red);
    }

    .empty-state {
      font-family: 'Kalam', cursive;
      color: var(--ink-soft);
      font-size: 1.05rem;
      padding: 28px 4px 10px;
      opacity: 0.75;
    }

    .footer-note {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px dashed rgba(43, 58, 85, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--ink-soft);
    }

    .footer-note .badge {
      background: var(--highlight);
      color: var(--ink);
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .book { padding: 34px 20px 26px 46px; }
      .greeting { font-size: 1.55rem; }
    }
  </style>
</head>
<body>

  <!-- LOGIN / SIGNUP STAGE -->
  <div class="stage" id="loginStage">
    <div class="cover">
      <div class="rings">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="ring"></div><div class="ring"></div>
      </div>
      <div class="cover-title">Dayline</div>
      <p class="cover-sub">A handwritten planner for your tasks.</p>

      <!-- LOGIN VIEW -->
      <div id="loginView">
        <div class="field">
          <label for="loginUsername">Username</label>
          <div class="field-input-row">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21c0-3.9-3.6-7-8-7s-8 3.1-8 7"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="loginUsername" type="text" placeholder="e.g. alex" autocomplete="username">
          </div>
        </div>

        <div class="cover-actions">
          <button class="btn btn-primary" id="loginBtn">Open notebook</button>
        </div>
        <p class="switch-link">New here? <button type="button" id="toSignup">Create account</button></p>
      </div>

      <!-- SIGNUP VIEW -->
      <div id="signupView" class="hidden">
        <div class="field">
          <label for="fullName">Full Name</label>
          <div class="field-input-row">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21c0-3.9-3.6-7-8-7s-8 3.1-8 7"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="fullName" type="text" placeholder="e.g. Alex Morgan" autocomplete="name">
          </div>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <div class="field-input-row">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
            </svg>
            <input id="username" type="text" placeholder="pick a username" autocomplete="username">
          </div>
        </div>

        <div class="cover-actions">
          <button class="btn btn-primary" id="signupBtn">Create account</button>
        </div>
        <p class="switch-link">Already have an account? <button type="button" id="toLogin">Log in</button></p>
      </div>

      <div class="cover-error" id="authError"></div>
      <p class="cover-note">Local storage app: Tasks and account data are saved directly in your browser.</p>
    </div>
  </div>

  <!-- APP STAGE -->
  <div class="stage hidden" id="appStage">
    <div class="book">
      <div class="app-header">
        <div>
          <div class="greeting" id="greeting">Hey there —</div>
          <div class="date-stamp" id="dateStamp"></div>
        </div>
        <button class="logout" id="logoutBtn">Log out</button>
      </div>

      <div class="add-row">
        <input id="taskInput" type="text" placeholder="Write the next thing to do…" maxlength="140">
        <button class="add-btn" id="addBtn" aria-label="Add task">+</button>
      </div>

      <div class="filters">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="active">Open</button>
        <button class="filter-tab" data-filter="done">Done</button>
      </div>

      <ul class="task-list" id="taskList"></ul>
      <div class="empty-state hidden" id="emptyState">Nothing here yet. Add your first task above.</div>

      <div class="footer-note">
        <span id="footerCount">0 tasks</span>
        <span class="badge" id="footerBadge">0 done</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginStage = document.getElementById('loginStage');
      const appStage = document.getElementById('appStage');
      const loginView = document.getElementById('loginView');
      const signupView = document.getElementById('signupView');
      const toSignup = document.getElementById('toSignup');
      const toLogin = document.getElementById('toLogin');
      const loginUsernameInput = document.getElementById('loginUsername');
      const loginBtn = document.getElementById('loginBtn');
      const fullNameInput = document.getElementById('fullName');
      const signupUsernameInput = document.getElementById('username');
      const signupBtn = document.getElementById('signupBtn');
      const authError = document.getElementById('authError');
      const greeting = document.getElementById('greeting');
      const dateStamp = document.getElementById('dateStamp');
      const logoutBtn = document.getElementById('logoutBtn');
      const taskInput = document.getElementById('taskInput');
      const addBtn = document.getElementById('addBtn');
      const taskList = document.getElementById('taskList');
      const emptyState = document.getElementById('emptyState');
      const filterTabs = document.querySelectorAll('.filter-tab');
      const footerCount = document.getElementById('footerCount');
      const footerBadge = document.getElementById('footerBadge');

      let currentUser = JSON.parse(localStorage.getItem('dayline_session')) || null;
      let tasks = [];
      let currentFilter = 'all';


      function init() {
        setDateStamp();
        if (currentUser) {
          showApp();
        } else {
          showAuth();
        }
      }

      function setDateStamp() {
        const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
        dateStamp.textContent = new Date().toLocaleDateString('en-US', options).toUpperCase();
      }

      toSignup.onclick = () => {
        loginView.classList.add('hidden');
        signupView.classList.remove('hidden');
        authError.textContent = '';
      };

      toLogin.onclick = () => {
        signupView.classList.add('hidden');
        loginView.classList.remove('hidden');
        authError.textContent = '';
      };

      loginBtn.onclick = handleLogin;
      loginUsernameInput.onkeydown = (e) => e.key === 'Enter' && handleLogin();

      function handleLogin() {
        const username = loginUsernameInput.value.trim();
        if (!username) return showError('Please enter a username.');

        const users = JSON.parse(localStorage.getItem('dayline_users')) || {};
        currentUser = users[username.toLowerCase()] || { username: username, name: username };
        users[username.toLowerCase()] = currentUser;

        localStorage.setItem('dayline_users', JSON.stringify(users));
        localStorage.setItem('dayline_session', JSON.stringify(currentUser));
        showApp();
      }

      signupBtn.onclick = () => {
        const name = fullNameInput.value.trim();
        const username = signupUsernameInput.value.trim();

        if (!name || !username) return showError('Please fill out all fields.');

        const users = JSON.parse(localStorage.getItem('dayline_users')) || {};
        if (users[username.toLowerCase()]) return showError('Username is taken.');

        currentUser = { username, name };
        users[username.toLowerCase()] = currentUser;
        localStorage.setItem('dayline_users', JSON.stringify(users));
        localStorage.setItem('dayline_session', JSON.stringify(currentUser));
        showApp();
      };

      logoutBtn.onclick = () => {
        currentUser = null;
        localStorage.removeItem('dayline_session');
        showAuth();
      };

      function showError(msg) { authError.textContent = msg; }

      function showAuth() {
        loginStage.classList.remove('hidden');
        appStage.classList.add('hidden');
        authError.textContent = '';
      }

      function showApp() {
        loginStage.classList.add('hidden');
        appStage.classList.remove('hidden');
        greeting.textContent = `Hey, ${currentUser.name.split(' ')[0]} —`;
        loadTasks();
        renderTasks();
      }

      function getStorageKey() {
        return `dayline_tasks_${currentUser.username.toLowerCase()}`;
      }

      function loadTasks() {
        tasks = JSON.parse(localStorage.getItem(getStorageKey())) || [];
      }

      function saveTasks() {
        localStorage.setItem(getStorageKey(), JSON.stringify(tasks));
      }

      addBtn.onclick = addTask;
      taskInput.onkeydown = (e) => e.key === 'Enter' && addTask();

      function addTask() {
        const text = taskInput.value.trim();
        if (!text) return;

        tasks.unshift({ id: Date.now().toString(), text, done: false });
        saveTasks();
        taskInput.value = '';
        renderTasks();
      }

      filterTabs.forEach(tab => {
        tab.onclick = () => {
          filterTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentFilter = tab.dataset.filter;
          renderTasks();
        };
      });

      function renderTasks() {
        taskList.innerHTML = '';
        const filtered = tasks.filter(t => {
          if (currentFilter === 'active') return !t.done;
          if (currentFilter === 'done') return t.done;
          return true;
        });

        emptyState.classList.toggle('hidden', filtered.length > 0);

        filtered.forEach(task => {
          const li = document.createElement('li');
          li.className = `task ${task.done ? 'done' : ''}`;
          li.innerHTML = `
            <button class="checkbox" aria-label="Toggle task">
              <svg viewBox="0 0 24 24">
                <rect class="box" x="2" y="2" width="20" height="20" rx="4"/>
                <path class="tick" d="M5 12l5 5L19 7"/>
              </svg>
            </button>
            <span class="task-text">${escapeHtml(task.text)}<span class="strike"></span></span>
            <div class="task-actions">
              <button class="icon-btn delete-btn" title="Delete">✕</button>
            </div>
          `;

          li.querySelector('.checkbox').onclick = () => {
            task.done = !task.done;
            saveTasks();
            renderTasks();
          };

          li.querySelector('.delete-btn').onclick = () => {
            li.classList.add('removing');
            setTimeout(() => {
              tasks = tasks.filter(t => t.id !== task.id);
              saveTasks();
              renderTasks();
            }, 250);
          };

          taskList.appendChild(li);
        });

        updateFooter();
      }


      function updateFooter() {
        const total = tasks.length;
        const completed = tasks.filter(t => t.done).length;
        footerCount.textContent = `${total} ${total === 1 ? 'task' : 'tasks'}`;
        footerBadge.textContent = `${completed} done`;
      }

      function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      init();
    });
  </script>
</body>
</html>
