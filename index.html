<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Planner</title>
  <style>
    :root { --bg: #f8f9fa; --card: #ffffff; --text: #212529; --accent: #2b3a55; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 16px; margin: 0; }
    .card { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); width: 100%; max-width: 380px; }
    h2 { margin: 0 0 16px; font-size: 1.25rem; }
    .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #dde1e5; border-radius: 6px; font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--accent); }
    button.add-btn { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f3f5; }
    li span { cursor: pointer; flex: 1; user-select: none; }
    li.done span { text-decoration: line-through; color: #adb5bd; }
    .del { background: none; border: none; color: #e63946; font-size: 1.1rem; cursor: pointer; padding: 0 4px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Today’s Tasks</h2>
    <div class="add-row">
      <input id="input" type="text" placeholder="Add a task..." />
      <button class="add-btn" id="addBtn">Add</button>
    </div>
    <ul id="list"></ul>
  </div>

  <script>
    const input = document.getElementById('input'), addBtn = document.getElementById('addBtn'), list = document.getElementById('list');
    let tasks = JSON.parse(localStorage.getItem('quick_tasks')) || [];

    function render() {
      list.innerHTML = tasks.map((t, i) => `
        <li class="${t.done ? 'done' : ''}">
          <span onclick="toggle(${i})">${escape(t.text)}</span>
          <button class="del" onclick="remove(${i})">✕</button>
        </li>
      `).join('');
      localStorage.setItem('quick_tasks', JSON.stringify(tasks));
    }

    addBtn.onclick = () => {
      if (input.value.trim()) {
        tasks.unshift({ text: input.value.trim(), done: false });
        input.value = '';
        render();
      }
    };

    input.onkeydown = (e) => e.key === 'Enter' && addBtn.click();
    window.toggle = (i) => { tasks[i].done = !tasks[i].done; render(); };
    window.remove = (i) => { tasks.splice(i, 1); render(); };
    function escape(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    render();
  </script>
</body>
</html>
